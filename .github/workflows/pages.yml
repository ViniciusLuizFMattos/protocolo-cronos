# Gera a versão web do jogo (pygbag / WebAssembly) e publica no GitHub Pages.
# Ative em: Settings -> Pages -> Source: GitHub Actions
name: Publicar versão web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: |
          pip install pygame
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python test_headless.py
      - name: Build web (pygbag)
        run: |
          pip install pygbag
          python -m pygbag --build --title "Protocolo Cronos" .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
